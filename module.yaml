# Namespace is derived from github.com/octoeverywhere/connect-extension:
# com.github.aux.octoeverywhere.connect-extension.
name: octoeverywhere
title: AI Failure Detection
kind: sink
version: 0.1.1
license: MIT
summary: Gadget AI print failure detection with per-printer monitoring and optional automatic pause.
codeowner: OctoEverywhere
lifecycle: beta
contract_major: 1
openapi: openapi.json

require:
  core: ">=0.1.0-beta.1"
  core-device.list: "*"
  core-device.get: "*"
  core-device.jobs: "*"
  core-device.command: "*"
  core-access.check: "*"

platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

options:
  - key: connect_url
    type: url
    default: "http://127.0.0.1:8080"
    summary: The Prusa Connect HTTP origin used to read configured camera snapshots.

# Credentials and print sessions use private atomic JSON files in the granted
# directory. No host records backend, database, or listening port is required.
needs:
  memory_mib: 128
  data: true

permissions:
  # Follow printer state and active jobs while no browser page is open.
  - observe
  # This is the permission ceiling, not an automatic grant. Automatic pause
  # additionally requires an operator grant on each enabled printer.
  - operate
checks:
  # Check the calling person's permission before changing module settings.
  - operate_resource

egress:
  - host: "*.octoeverywhere.com"
    ports: [443]
    from: process
    why: Analyzes selected camera snapshots for print failures. Gadget deletes images immediately after processing; never retains them, uses them for training, or sells them.
    sends: JPEG snapshots, confidence settings, and private print context IDs; the Gadget API key is sent only when creating a context.
  - option: connect_url
    ports: [80, 443, 8080, 8443, 18480]
    from: process
    why: Reads cameras and fresh snapshots through the operator's Prusa Connect server.
    sends: A saved Prusa Connect API token and requests for the selected printer's cameras.

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: octoeverywhere
        title: OctoEverywhere
